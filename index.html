<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>RING — Everyday life in Bells</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RING — DESIGN TOKENS
   ============================================================ */
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --ink:#111111;
  --ink-2:#3F3F45;
  --muted:#7A7A80;
  --muted-2:#A0A0A6;
  --line:#E9E9EC;
  --line-2:#F1F1F3;
  --bg:#FFFFFF;
  --bg-2:#F6F6F7;
  --bg-3:#EFEFF2;
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:22px;
  --nav-h:64px;
  --sidebar-w:250px;
  --shadow-1:0 1px 2px rgba(17,17,17,.05);
  --shadow-2:0 10px 34px rgba(17,17,17,.10);
  --shadow-3:0 24px 70px rgba(17,17,17,.18);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font);
  font-size:15px;
  line-height:1.55;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body.modal-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
::selection{background:#111;color:#fff}

/* ============================================================
   TYPOGRAPHY / HELPERS
   ============================================================ */
.h1{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.25}
.h2{font-size:18px;font-weight:650;letter-spacing:-.02em;line-height:1.3}
.h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted)}
.xs{font-size:11.5px}
.sm{font-size:13px}
.muted{color:var(--muted)}
.fw600{font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{min-height:100dvh}
.shell{min-height:100dvh;display:flex;flex-direction:column}
.main-area{flex:1;display:flex;flex-direction:column}
main.page{
  flex:1;
  padding-bottom:calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));
}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 18px}
.wrap.wide{max-width:1080px}
.wrap.wide-2{max-width:920px}
.section{margin-top:26px}
.section:first-child{margin-top:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head .link{font-size:12.5px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px;border-bottom:1px solid transparent;padding-bottom:1px}
.section-head .link:active{opacity:.6}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2)}

/* ============================================================
   ICON BUTTONS / AVATARS
   ============================================================ */
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;color:var(--ink);
  transition:background .16s ease;
  flex:0 0 auto;
}
.icon-btn:hover{background:var(--bg-2)}
.icon-btn:active{background:var(--bg-3)}
.avatar{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;
  background:var(--ink);color:#fff;
  font-size:12.5px;font-weight:650;letter-spacing:.02em;
  flex:0 0 auto;user-select:none;
}
.avatar.sm{width:30px;height:30px;font-size:11px}
.avatar.lg{width:64px;height:64px;font-size:22px;font-weight:600}
.avatar.ghost{background:var(--bg-3);color:var(--ink-2)}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:46px;padding:0 20px;border-radius:12px;
  font-size:14px;font-weight:600;letter-spacing:-.01em;
  transition:transform .12s ease, background .16s ease, opacity .16s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.ghost{background:var(--bg-2);color:var(--ink)}
.btn.ghost:hover{background:var(--bg-3)}
.btn.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.outline:hover{background:var(--bg-2)}
.btn.danger{background:#fff;border:1px solid var(--line);color:#B4242A}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 14px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-link{font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ============================================================
   FORM ELEMENTS
   ============================================================ */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.input,.select,.textarea{
  width:100%;height:46px;padding:0 14px;border-radius:12px;
  background:var(--bg-2);border:1px solid transparent;
  font-size:14.5px;color:var(--ink);outline:none;
  transition:border-color .16s ease, background .16s ease;
}
.textarea{height:auto;padding:12px 14px;resize:vertical;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--muted-2)}
.input:focus,.select:focus,.textarea:focus{background:#fff;border-color:var(--ink)}
.select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237A7A80' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px;
}
.search-box{position:relative}
.search-box .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.search-box .input{padding-left:42px}
.check{
  width:20px;height:20px;border-radius:6px;border:1.6px solid #CFCFD4;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:all .14s ease;color:transparent;
}
.check.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:300;
  background:var(--ink);color:#fff;font-size:13px;font-weight:500;
  padding:11px 18px;border-radius:999px;box-shadow:var(--shadow-2);
  opacity:0;transition:opacity .22s ease, transform .22s ease;
  max-width:88vw;text-align:center;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.toast{bottom:32px}}

/* ============================================================
   MODAL / SHEET
   ============================================================ */
#modal-root{position:fixed;inset:0;z-index:200;pointer-events:none}
#modal-root.open{pointer-events:auto}
.modal-backdrop{
  position:absolute;inset:0;background:rgba(17,17,17,.42);
  opacity:0;transition:opacity .2s ease;backdrop-filter:blur(2px);
}
#modal-root.open .modal-backdrop{opacity:1}
.modal{
  position:absolute;left:0;right:0;bottom:0;
  background:#fff;border-radius:22px 22px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:var(--shadow-3);
}
#modal-root.open .modal{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-title{font-size:16px;font-weight:650;letter-spacing:-.02em}
@media(min-width:760px){
  .modal{
    left:50%;bottom:auto;top:50%;width:min(560px,92vw);
    border-radius:20px;transform:translate(-50%,-46%) scale(.98);
    max-height:82dvh;
  }
  #modal-root.open .modal{transform:translate(-50%,-50%) scale(1)}
}

/* ============================================================
   SPLASH
   ============================================================ */
.splash{
  min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#fff;position:relative;
}
.splash-word{
  font-size:46px;font-weight:700;letter-spacing:.30em;text-indent:.30em;
  color:var(--ink);
}
.splash-tag{margin-top:12px;font-size:13.5px;color:var(--muted);letter-spacing:.01em}
.splash-bar{
  position:absolute;bottom:76px;width:120px;height:2px;background:var(--line-2);
  border-radius:2px;overflow:hidden;
}
.splash-bar i{display:block;height:100%;width:40%;background:var(--ink);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}

/* ============================================================
   ONBOARDING
   ============================================================ */
.onb{min-height:100dvh;display:flex;flex-direction:column;background:#fff;padding-top:env(safe-area-inset-top)}
.onb-top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}
.onb-word{font-size:16px;font-weight:700;letter-spacing:.26em;text-indent:.26em}
.onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 26px;max-width:560px;margin:0 auto;width:100%}
.onb-icon{
  width:62px;height:62px;border-radius:18px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;margin-bottom:26px;
}
.onb-title{font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1.18;margin-bottom:12px}
.onb-text{font-size:15px;color:var(--muted);line-height:1.6;max-width:420px}
.onb-foot{padding:0 26px 34px;max-width:560px;margin:0 auto;width:100%}
.dots{display:flex;gap:6px;margin-bottom:22px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s ease}
.dots i.on{background:var(--ink);width:20px;border-radius:3px}

/* ============================================================
   AUTH
   ============================================================ */
.auth{min-height:100dvh;display:flex;flex-direction:column;padding:0 24px;max-width:460px;margin:0 auto;width:100%}
.auth-top{flex:1;display:flex;flex-direction:column;justify-content:center;padding:44px 0 20px}
.auth-word{font-size:22px;font-weight:700;letter-spacing:.26em;text-indent:.26em;margin-bottom:36px}
.auth-title{font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.22}
.auth-sub{font-size:14px;color:var(--muted);margin-top:8px}
.auth-foot{padding-bottom:34px}
.divider-or{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted-2);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--line)}
.auth-links{display:flex;align-items:center;justify-content:space-between;margin-top:4px;margin-bottom:20px}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:50;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 0 6px;
}
.wordmark{font-size:17px;font-weight:700;letter-spacing:.28em;text-indent:.28em}
.topbar-actions{display:flex;align-items:center;gap:4px}
.bell-wrap{position:relative}
.bell-dot{
  position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;
  background:var(--ink);border:1.5px solid #fff;
}

/* ============================================================
   GREETING
   ============================================================ */
.greet{padding:6px 0 18px}
.greet h1{font-size:25px;font-weight:700;letter-spacing:-.035em;line-height:1.25}
.greet .sub{margin-top:5px}

/* ============================================================
   STAT CARDS
   ============================================================ */
.stat-row{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.stat-row::-webkit-scrollbar{display:none}
.stat{
  flex:0 0 auto;min-width:152px;max-width:190px;
  text-align:left;background:var(--bg-2);border-radius:var(--radius);
  padding:14px;display:flex;flex-direction:column;gap:2px;
  transition:background .16s ease, transform .12s ease;
}
.stat:active{transform:scale(.985);background:var(--bg-3)}
.stat .ic{color:var(--ink-2);margin-bottom:8px}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2)}
.stat-value{font-size:16px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.stat-meta{font-size:12px;color:var(--muted)}

/* ============================================================
   CARDS / PANELS
   ============================================================ */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel.flat{background:var(--bg-2);border-color:transparent}

/* Day selector */
.day-strip{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-pill{
  flex:1;min-width:46px;height:56px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--bg-2);color:var(--muted);font-size:12px;font-weight:500;
  transition:all .16s ease;
}
.day-pill b{font-size:14px;font-weight:650;color:var(--ink)}
.day-pill.on{background:var(--ink);color:rgba(255,255,255,.72)}
.day-pill.on b{color:#fff}

/* Class row */
.class-row{
  display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);
}
.class-row:last-child{border-bottom:0;padding-bottom:0}
.class-time{
  font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;
  min-width:62px;padding-top:1px;font-variant-numeric:tabular-nums;
}
.class-body{flex:1;min-width:0}
.class-code{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.class-meta{font-size:12px;color:var(--muted);margin-top:1px}
.class-accent{width:3px;border-radius:3px;background:var(--ink);flex:0 0 auto;margin:-2px 0}

/* Task row */
.task-row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.task-row:last-child{border-bottom:0;padding-bottom:0}
.task-title{font-size:13.5px;font-weight:500;line-height:1.4}
.task-row.done .task-title{color:var(--muted-2);text-decoration:line-through}
.task-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.prio.high{color:#B4242A}
.prio.medium{color:#8A6A12}
.prio.low{color:var(--muted)}

/* Progress */
.progress{height:5px;border-radius:3px;background:var(--bg-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .35s ease}

/* ============================================================
   POSTS
   ============================================================ */
.post{padding:15px 0;border-bottom:1px solid var(--line-2)}
.post:last-child{border-bottom:0}
.post-top{display:flex;align-items:flex-start;gap:10px}
.post-id{flex:1;min-width:0}
.post-nick{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.post-meta{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:6px}
.cat-tag{
  font-size:10.5px;font-weight:600;letter-spacing:.03em;
  background:var(--bg-2);color:var(--ink-2);padding:1px 7px;border-radius:999px;
}
.post-text{font-size:14.5px;line-height:1.55;margin-top:10px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.post-actions{display:flex;align-items:center;gap:4px;margin-top:10px}
.pa{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 10px;border-radius:999px;
  font-size:12.5px;color:var(--muted);font-weight:500;
  transition:all .16s ease;
}
.pa:hover{background:var(--bg-2);color:var(--ink)}
.pa.on{color:var(--ink);font-weight:600}
.pa.on .ic{fill:var(--ink)}
.post-expiry{margin-left:auto;font-size:11px;color:var(--muted-2)}

/* Comments */
.comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.comment:last-child{border-bottom:0}
.comment-body{flex:1;min-width:0}
.comment-text{font-size:13.5px;line-height:1.5;margin-top:3px;word-break:break-word}
.comment-actions{display:flex;align-items:center;gap:14px;margin-top:6px}
.comment-actions button{font-size:11.5px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.comment-actions button.on{color:var(--ink);font-weight:600}
.comment-actions button.on .ic{fill:var(--ink)}
.reply{margin-left:38px;border-left:2px solid var(--line);padding-left:12px;margin-top:8px}

/* ============================================================
   CHIPS / TABS
   ============================================================ */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:32px;padding:0 13px;border-radius:999px;
  background:var(--bg-2);color:var(--ink-2);font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;transition:all .16s ease;
  white-space:nowrap;
}
.chip:hover{background:var(--bg-3)}
.chip.on{background:var(--ink);color:#fff}

.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{
  position:relative;padding:0 0 12px;font-size:13.5px;font-weight:600;color:var(--muted);
  transition:color .16s ease;
}
.tab.on{color:var(--ink)}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}

/* ============================================================
   PRODUCT / VENDOR CARDS
   ============================================================ */
.ph{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;
  background:var(--bg-3);display:flex;align-items:center;justify-content:center;
}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .ph-fb{display:none;font-size:22px;font-weight:700;color:var(--muted-2);letter-spacing:.02em}
.ph.fail .ph-fb{display:block}
.ph.fail img{display:none}

.grid-products{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;
}
@media(min-width:640px){.grid-products{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:980px){.grid-products{grid-template-columns:repeat(4,minmax(0,1fr))}}

.product{text-align:left;display:flex;flex-direction:column;gap:0;position:relative}
.product .ph{aspect-ratio:1/1}
.product-name{font-size:13px;font-weight:550;letter-spacing:-.01em;margin-top:9px;line-height:1.35}
.product-vendor{font-size:11.5px;color:var(--muted);margin-top:2px}
.product-price{font-size:13.5px;font-weight:650;margin-top:5px;letter-spacing:-.01em}
.fav{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;
  color:var(--ink);box-shadow:var(--shadow-1);
}
.fav.on .ic{fill:var(--ink)}

.vendor-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.vendor-row::-webkit-scrollbar{display:none}
.vendor{
  flex:0 0 auto;width:148px;text-align:left;
  background:var(--bg-2);border-radius:var(--radius);padding:12px;
  transition:background .16s ease, transform .12s ease;
}
.vendor:active{transform:scale(.985);background:var(--bg-3)}
.vendor .ph{aspect-ratio:16/10;border-radius:9px;margin-bottom:9px}
.vendor-name{font-size:13px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.vendor-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px}

/* ============================================================
   LIST ROWS
   ============================================================ */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px 16px;border-bottom:1px solid var(--line-2);
  transition:background .14s ease;
}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:var(--bg-2)}
.list-row .ic{color:var(--ink-2);flex:0 0 auto}
.list-row .chev{margin-left:auto;color:var(--muted-2);flex:0 0 auto}
.list-label{font-size:14px;font-weight:500;letter-spacing:-.01em}
.list-sub{font-size:12px;color:var(--muted);margin-top:1px}

/* Quick access */
.quick-access-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick-access-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 4px;border-radius:12px;background:var(--bg-2);
  transition:background .16s ease, transform .12s ease;
}
.quick-access-item:active{transform:scale(.97);background:var(--bg-3)}
.quick-access-item span{font-size:11px;font-weight:500;color:var(--ink-2);text-align:center;line-height:1.25}

/* Empty state */
.empty{
  text-align:center;padding:44px 20px;color:var(--muted);
}
.empty .ic{margin:0 auto 12px;color:var(--muted-2)}
.empty h3{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
.empty p{font-size:13px;max-width:280px;margin:0 auto}

/* Badge */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;letter-spacing:.03em;
  padding:3px 8px;border-radius:999px;background:var(--bg-2);color:var(--ink-2);
}
.badge.verified{background:#111;color:#fff}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.97);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  display:flex;align-items:stretch;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:10px;font-weight:500;letter-spacing:.01em;color:var(--muted);
  position:relative;transition:color .16s ease;
}
.nav-item .ic{transition:transform .16s ease}
.nav-item.active{color:var(--ink);font-weight:650}
.nav-item.active .ic{transform:translateY(-1px)}
.nav-item.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2px;border-radius:0 0 2px 2px;background:var(--ink);
}
.nav-item:active{opacity:.65}
.bottom-nav .nav-item.nav-ai{z-index:1;transform:translateY(-10px)}
.bottom-nav .nav-item.nav-ai .ic{
  flex:0 0 54px;width:54px;height:54px;padding:14px;border:4px solid #fff;border-radius:50%;
  background:var(--ink);color:#fff;box-shadow:0 5px 16px rgba(17,17,17,.22);
  transform:none;
}
.bottom-nav .nav-item.nav-ai.active::before{display:none}

/* ============================================================
   FAB
   ============================================================ */
.fab{
  position:fixed;right:18px;
  bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  z-index:80;
  width:56px;height:56px;border-radius:50%;
  background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 28px rgba(17,17,17,.30);
  transition:transform .16s ease, background .16s ease;
}
.fab:hover{background:#000}
.fab:active{transform:scale(.94)}

/* ============================================================
   SIDEBAR (desktop)
   ============================================================ */
.sidebar{display:none}
@media(min-width:900px){
  .bottom-nav{display:none}
  .sidebar{
    display:flex;flex-direction:column;
    position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);z-index:80;
    border-right:1px solid var(--line);background:#fff;
    padding:24px 14px 20px;
  }
  .side-word{font-size:19px;font-weight:700;letter-spacing:.28em;text-indent:.28em;padding:0 12px;margin-bottom:26px}
  .side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .side-nav .nav-item{
    flex-direction:row;justify-content:flex-start;gap:13px;
    height:46px;padding:0 12px;border-radius:11px;
    font-size:14px;font-weight:500;color:var(--ink-2);
  }
  .side-nav .nav-item.active{background:var(--bg-2);color:var(--ink);font-weight:650}
  .side-nav .nav-item.active::before{display:none}
  .side-nav .nav-item:hover{background:var(--bg-2)}
  .main-area{margin-left:var(--sidebar-w)}
  main.page{padding-bottom:40px}
  .fab{right:28px;bottom:28px}
  .wrap{padding:0 28px}
  .toast{bottom:28px}
}

.msg.me .msg-bubble{background:var(--ink);color:#fff;border-radius:14px 14px 4px 14px}

  const s = (Date.now() - ts) / 1000;

/* ============================================================
   STATE
   ============================================================ */
const KEY = 'ring.prototype.v1';
let state = null;

function defaultState(){
  return {
    phase: 'splash',
    seenOnboarding: false,
    user: null,
    view: 'home',
    params: {},
    posts: seedPosts(),
    classes: seedClasses(),
    tasks: seedTasks(),
    resources: seedResources(),
    notifications: seedNotifications(),
    news: seedNews(),
    cart: [],
    savedProducts: [],
    savedResources: [],
    prefs: { push: true, email: true, digest: false },
    feedSort: 'foryou',
    feedFilter: 'all',
    aiMessages: [],
    aiDraft: '',
    search: '',
    exploreCat: 'All',
    homeDay: null,
    homeFeaturesExpanded: false,
    academicsTab: 'timetable',
    academicsDay: 1,
    academicsResFilter: { dept: 'All', level: 'All', sem: 'All' },
    draftComment: ''
  };
}
function save(){
  try {
    const persist = {
      seenOnboarding: state.seenOnboarding,
      user: state.user,
      posts: state.posts,
      classes: state.classes,
      tasks: state.tasks,
      resources: state.resources,
      notifications: state.notifications,
      cart: state.cart,
      savedProducts: state.savedProducts,
      savedResources: state.savedResources,
      prefs: state.prefs
    };
    localStorage.setItem(KEY, JSON.stringify(persist));
  } catch(e){ /* storage unavailable — prototype continues in memory */ }
}
function load(){
  state = defaultState();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw){
      const p = JSON.parse(raw);
      Object.assign(state, p);
      if (!state.posts || !state.posts.length) state.posts = seedPosts();
      if (!state.classes) state.classes = seedClasses();
      if (!state.tasks) state.tasks = seedTasks();
      if (!state.resources) state.resources = seedResources();
      if (!state.notifications) state.notifications = seedNotifications();
      if (!state.prefs) state.prefs = { push:true, email:true, digest:false };
    }
  } catch(e){ state = defaultState(); }
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  let el = $('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ---------- modal ---------- */
function openModal(html){
  const r = $('#modal-root');
  r.innerHTML = `<div class="modal-backdrop" data-act="close-modal"></div><div class="modal">${html}</div>`;
  document.body.classList.add('modal-open');
  requestAnimationFrame(() => r.classList.add('open'));
}
function closeModal(){
  const r = $('#modal-root');
  r.classList.remove('open');
  document.body.classList.remove('modal-open');
  setTimeout(() => { if (!r.classList.contains('open')) r.innerHTML = ''; }, 200);
}
function confirmDialog(title, message, confirmLabel, onConfirm){
  openModal(`
    <div class="sheet-head"><div class="sheet-title">${esc(title)}</div></div>
    <p class="sub" style="margin-bottom:20px">${esc(message)}</p>
    <div class="row" style="gap:10px">
      <button class="btn ghost grow" data-act="close-modal">Cancel</button>
      <button class="btn primary grow" id="confirm-yes">${esc(confirmLabel)}</button>
    </div>
  `);
  $('#confirm-yes').addEventListener('click', () => { closeModal(); onConfirm(); });
}

function todayDayIndex(){
  const d = new Date().getDay();
  return d === 0 || d === 6 ? 1 : d;
}
function classesForDay(day){
  return state.classes.filter(c => c.day === day).sort((a, b) => a.start.localeCompare(b.start));
}
function nextClassInfo(){
  const today = todayDayIndex();
  for (let offset = 0; offset < 5; offset++){
    const day = ((today - 1 + offset) % 5) + 1;
    const list = classesForDay(day);
    if (!list.length) continue;
    if (offset === 0){
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      const upcoming = list.find(c => {
        const [h, m] = c.start.split(':').map(Number);
        return h * 60 + m >= nowMin;
      });
      if (upcoming) return { cls: upcoming, day, isToday: true };
      continue;
    }
    return { cls: list[0], day, isToday: false };
  }
  const fallback = state.classes[0];
  return fallback ? { cls: fallback, day: fallback.day, isToday:false } : null;
}

function commentCount(p){
  return p.comments.reduce((n, c) => n + 1 + (c.replies ? c.replies.length : 0), 0);
}
function postEngagement(p){
  return p.likes + commentCount(p);
}
function expiryDaysLeft(p){
  const days = postEngagement(p) >= 6 ? 14 : 7;
  const expiresAt = p.createdAt + days * D;
  const left = Math.ceil((expiresAt - Date.now()) / D);
  return Math.max(0, left);
}
function sortedPosts(){
  let list = [...state.posts];
  if (state.feedFilter !== 'all'){
    list = list.filter(p => p.cat === state.feedFilter);
  }
  const sort = state.feedSort;
  if (sort === 'latest'){
    list.sort((a, b) => b.createdAt - a.createdAt);
  } else if (sort === 'trending'){
    list.sort((a, b) => (postEngagement(b) * 1.0 + (b.createdAt - a.createdAt) / D) - (postEngagement(a) * 1.0 + (a.createdAt - b.createdAt) / D));
    list.sort((a, b) => postEngagement(b) - postEngagement(a));
  } else {
    list.sort((a, b) => (b.createdAt + postEngagement(b) * 12 * 60000) - (a.createdAt + postEngagement(a) * 12 * 60000));
  }
  return list;
}
function viewFeed(){

  return `

      </div>

      <div class="chat" id="ai-chat">
        ${msgs.length ? msgs.map(m => `
          <div class="msg ${m.role === 'me' ? 'me' : ''}">
            ${m.role === 'ai' ? `<span class="avatar sm ghost">${icon('ai', 15)}</span>` : ''}

          </div>`).join('') : `
          <div class="msg">

          </div>`}

      ${!msgs.length ? `

          <div class="eyebrow" style="margin-bottom:10px">Suggested</div>
          <div class="chips" style="flex-wrap:wrap;overflow:visible">

          </div>
        </div>` : ''}

      <form class="chat-input-bar" data-form="ai-send">
        <input class="input" name="text" id="ai-input" placeholder="Ask Ring AI…" autocomplete="off" value="${esc(state.aiDraft || '')}" />

function aiRespond(text){
  const t = text.toLowerCase();
  const hit = AI_REPLIES.find(r => r.k.some(k => t.includes(k)));
  if (hit) return hit.r;
  return "That's a great question. This is a demo preview of Ring AI, so I can't answer it fully yet — in the finished product I'll be connected to your timetable, tasks, resources and the campus marketplace to answer that properly.";
}

  const row = t => `
    <div class="task-row ${t.done ? 'done' : ''}">

/* ============================================================
   AFTER RENDER — targeted listeners
   ============================================================ */
function afterRender(){
  const search = $('#explore-search');
  if (search){
    search.addEventListener('input', e => {
      state.search = e.target.value;
      const pos = e.target.selectionStart;
      const wrap = e.target.closest('.page');
      // Re-render only the results section for snappy typing
      const resultsSection = $$('.section', wrap).find(s => s.querySelector('.grid-products') || s.querySelector('.empty'));
      const q = state.search.toLowerCase().trim();
      const cat = state.exploreCat || 'All';
      const list = PRODUCTS.filter(p => {
        const v = VENDORS.find(x => x.id === p.vendor);
        const matchCat = cat === 'All' || p.cat === cat;
        const matchQ = !q || p.name.toLowerCase().includes(q) || (v && v.name.toLowerCase().includes(q)) || p.cat.toLowerCase().includes(q);
        return matchCat && matchQ;
      });
      if (resultsSection){
        const head = resultsSection.querySelector('.section-head h2');
        const count = resultsSection.querySelector('.section-head .xs');
        if (head) head.textContent = q ? 'Search results' : (cat === 'All' ? 'New arrivals' : cat);
        if (count) count.textContent = `${list.length} ${list.length === 1 ? 'item' : 'items'}`;
        const grid = resultsSection.querySelector('.grid-products');
        if (grid){
          if (list.length){ grid.innerHTML = list.map(p => productCard(p)).join(''); }
          else {
            resultsSection.innerHTML = `
              <div class="section-head"><h2 class="h2">Search results</h2><span class="xs muted tnum">0 items</span></div>
              <div class="empty">${icon('search', 30)}<h3>No products found</h3><p>Try a different search term or category.</p></div>`;
          }
        } else {
          resultsSection.innerHTML = `
            <div class="section-head"><h2 class="h2">${q ? 'Search results' : 'New arrivals'}</h2><span class="xs muted tnum">${list.length} items</span></div>
            <div class="grid-products">${list.map(p => productCard(p)).join('')}</div>`;
        }
      }
      const el = $('#explore-search');
      if (el){ el.focus(); el.setSelectionRange(pos, pos); }
    });
  }

  const aiInput = $('#ai-input');
  if (aiInput){
    aiInput.addEventListener('input', e => { state.aiDraft = e.target.value; });
    aiInput.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); e.target.form.requestSubmit(); }
    });
  }

  const composer = $('#composer-text');
  if (composer){
    composer.addEventListener('input', e => {
      const c = $('#composer-count');
      if (c) c.textContent = `${e.target.value.length}/280`;
    });
    setTimeout(() => composer.focus(), 120);
  }

  const chat = $('#ai-chat');
  if (chat) chat.scrollIntoView({ block:'end' });
}

/* ============================================================
   EVENT DELEGATION — CLICKS
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  switch(act){
    /* ---- onboarding / auth ---- */
    case 'skip-onboarding':
      state.seenOnboarding = true; state.phase = 'auth'; save(); render(); break;
    case 'onb-next':
      if (onbIndex < PILLARS.length - 1){ onbIndex++; render(); }
      else { state.seenOnboarding = true; state.phase = 'auth'; save(); render(); }
      break;
    case 'demo-login':
      state.user = { ...DEMO_USER, verified:false };
      state.kycDraft = { name:DEMO_USER.name, nick:DEMO_USER.nick, uni:DEMO_USER.uni, dept:DEMO_USER.dept, level:DEMO_USER.level, matric:DEMO_USER.matric };
      state.phase = 'kyc';
      render();
      break;
    case 'toast-signup':
      toast('Account creation is enabled through the demo flow.');
      break;
    case 'forgot':
      toast('Password reset is not available in the prototype.');
      break;

    /* ---- navigation ---- */
    case 'nav':
      go(el.dataset.view);
      break;
    case 'go':
      go(el.dataset.view, { tab: el.dataset.tab, id: el.dataset.id });
      break;

    /* ---- feed ---- */
    case 'feed-sort':
      state.feedSort = el.dataset.sort; render(); break;
    case 'feed-filter':
      state.feedFilter = el.dataset.filter; render(); break;
    case 'open-composer':
      openComposer(); break;
    case 'like-post': {
      const p = state.posts.find(x => x.id === id);
      if (p){
        p.liked = !p.liked;
        p.likes += p.liked ? 1 : -1;
        save(); render();
      }
      break;
    }
    case 'open-comments':
      openComments(id); break;
    case 'like-comment': {
      const p = state.posts.find(x => x.id === el.dataset.post);
      const c = p && p.comments.find(x => x.id === id);
      if (c){ c.liked = !c.liked; c.likes += c.liked ? 1 : -1; save(); openComments(p.id); }
      break;
    }
    case 'reply-comment': {
      const p = state.posts.find(x => x.id === el.dataset.post);
      const c = p && p.comments.find(x => x.id === id);
      if (!c) break;
      openModal(`
        <div class="sheet-head">
          <div class="sheet-title">Reply to @${esc(c.nick)}</div>
          <button class="icon-btn" data-act="close-modal">${icon('x', 20)}</button>
        </div>
        <p class="sub" style="margin-bottom:14px">${esc(c.text)}</p>
        <form data-form="add-reply" data-post="${p.id}" data-comment="${c.id}">
          <textarea class="textarea" name="text" rows="3" placeholder="Write a reply…" required></textarea>
          <div class="row" style="gap:10px;margin-top:14px">
            <button type="button" class="btn ghost grow" data-act="close-modal">Cancel</button>
            <button type="submit" class="btn primary grow">Reply</button>
          </div>
        </form>`);
      break;
    }
    case 'post-menu': {
      const p = state.posts.find(x => x.id === id);
      if (!p) break;
      openModal(`
        <div class="sheet-head">
          <div class="sheet-title">Post options</div>
          <button class="icon-btn" data-act="close-modal">${icon('x', 20)}</button>
        </div>
        <div class="list" style="border:0">
          <div class="list-row" style="cursor:default">
            <div class="grow">
              <div class="list-label">Expires in ${expiryDaysLeft(p)} days</div>
              <div class="list-sub">Posts live for 7 days, extended to a maximum of 14 days by meaningful engagement.</div>
            </div>
          </div>
          <button class="list-row" id="report-post">
            ${icon('shield', 19)}
            <div class="grow"><div class="list-label">Report post</div><div class="list-sub">Flag this post for moderation</div></div>
          </button>
        </div>`);
      $('#report-post').addEventListener('click', () => {
        closeModal();
        toast('Post reported. Our moderators will review it.');
      });
      break;
    }

    /* ---- home ---- */
    case 'home-day':
      state.homeDay = Number(el.dataset.day); render(); break;
    case 'home-features-toggle':
      state.homeFeaturesExpanded = !state.homeFeaturesExpanded; render(); break;

    /* ---- explore / cart ---- */
    case 'explore-cat':
      state.exploreCat = el.dataset.cat; render(); break;
    case 'open-store':
      go('store', { id: el.dataset.id }); break;
    case 'open-product':
      go('product', { id: el.dataset.id }); break;
    case 'fav-product': {
      const i = state.savedProducts.indexOf(id);
      if (i >= 0){ state.savedProducts.splice(i, 1); toast('Removed from saved'); }
      else { state.savedProducts.push(id); toast('Saved'); }
      save(); render(); break;
    }
    case 'add-cart': {
      const line = state.cart.find(l => l.id === id);
      if (line) line.qty++;
      else state.cart.push({ id, qty:1 });
      save(); toast('Added to cart'); render(); break;
    }
    case 'add-cart-checkout': {
      const line = state.cart.find(l => l.id === id);
      if (line) line.qty++;
      else state.cart.push({ id, qty:1 });
      save(); go('cart'); break;
    }
    case 'cart-inc': {
      const line = state.cart.find(l => l.id === id);
      if (line){ line.qty++; save(); render(); }
      break;
    }
    case 'cart-dec': {
      const line = state.cart.find(l => l.id === id);
      if (line){ line.qty--; if (line.qty <= 0) state.cart = state.cart.filter(l => l.id !== id); save(); render(); }
      break;
    }
    case 'clear-cart':
      confirmDialog('Clear cart', 'Remove all items from your cart?', 'Clear cart', () => {
        state.cart = []; save(); render(); toast('Cart cleared');
      });
      break;
    case 'checkout':
      if (!state.cart.length){ toast('Your cart is empty'); break; }
      toast('Demo checkout — vendor WhatsApp flow simulated');
      break;
    case 'vendor-whatsapp':
      toast('Opening WhatsApp chat with the vendor (simulated)');
      break;

    /* ---- academics ---- */
    case 'acad-tab':
      state.academicsTab = el.dataset.tab; render(); break;
    case 'acad-day':
      state.academicsDay = Number(el.dataset.day); render(); break;
    case 'toggle-task': {
      const t = state.tasks.find(x => x.id === id);
      if (t){ t.done = !t.done; save(); render(); }
      break;
    }
    case 'delete-task':
      confirmDialog('Delete task', 'This task will be removed from your planner.', 'Delete', () => {
        state.tasks = state.tasks.filter(t => t.id !== id); save(); render(); toast('Task deleted');
      });
      break;
    case 'open-add-task':
      openTaskModal(); break;
    case 'open-add-class':
      openClassModal(); break;
    case 'edit-class': {
      const c = state.classes.find(x => x.id === id);
      if (c) openClassModal(c);
      break;
    }
    case 'delete-class':
      confirmDialog('Delete class', 'Remove this class from your timetable?', 'Delete', () => {
        state.classes = state.classes.filter(c => c.id !== id); save(); render(); toast('Class removed');
      });
      break;
    case 'save-resource': {
      const i = state.savedResources.indexOf(id);
      if (i >= 0){ state.savedResources.splice(i, 1); toast('Resource removed'); }
      else { state.savedResources.push(id); toast('Resource saved'); }
      save(); render(); break;
    }
    case 'open-resource':
      toast('Opening resource (demo — no file attached)'); break;

    /* ---- notifications ---- */
    case 'read-notif': {
      const n = state.notifications.find(x => x.id === id);
      if (n){ n.read = true; save(); render(); }
      break;
    }
    case 'read-all':
      state.notifications.forEach(n => n.read = true); save(); render(); toast('All notifications read'); break;

    /* ---- map ---- */
    case 'map-pin':
      go('map', { loc: id }); break;

    /* ---- ai ---- */
    case 'ai-suggest': {
      const text = el.dataset.text;
      state.aiMessages.push({ role:'me', text });
      state.aiMessages.push({ role:'ai', text: aiRespond(text) });
      save(); render(); break;
    }
    case 'ai-clear':
      state.aiMessages = []; save(); render(); break;

    /* ---- settings ---- */
    case 'toggle-pref':
      state.prefs[el.dataset.pref] = !state.prefs[el.dataset.pref]; save(); render(); break;
    case 'edit-profile':
      openProfileModal(); break;
    case 'kyc-restart':
      state.kycDraft = { name:state.user.name, nick:state.user.nick, uni:state.user.uni, dept:state.user.dept, level:state.user.level, matric:state.user.matric };
      state.phase = 'kyc'; render(); break;
    case 'reset-data':
      confirmDialog('Reset demo data', 'This restores the prototype to its original state and signs you out.', 'Reset', () => {
        localStorage.removeItem(KEY);
        state = defaultState();
        state.phase = 'splash';
        render();
        setTimeout(() => { if (state.phase === 'splash'){ state.phase = 'onboarding'; render(); } }, 1500);
      });
      break;
    case 'signout':
      confirmDialog('Sign out', 'You will need to sign in again to access Ring.', 'Sign out', () => {
        const seen = state.seenOnboarding;
        state = defaultState();
        state.seenOnboarding = seen;
        state.phase = 'auth';
        save(); render();
      });
      break;

    case 'close-modal':
      closeModal(); break;
  }
});

/* ============================================================
   EVENT DELEGATION — FORMS
   ============================================================ */
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const data = new FormData(form);

  switch(kind){
    case 'login': {
      const email = (data.get('email') || '').toString().trim();
      const pass = (data.get('password') || '').toString();
      if (!email || !pass){ toast('Enter your email and password'); return; }
      state.user = { ...DEMO_USER, email };
      state.kycDraft = { name:DEMO_USER.name, nick:DEMO_USER.nick, uni:DEMO_USER.uni, dept:DEMO_USER.dept, level:DEMO_USER.level, matric:DEMO_USER.matric };
      state.phase = 'kyc'; render();
      break;
    }
    case 'kyc': {
      const name = (data.get('name') || '').toString().trim();
      const nick = (data.get('nick') || '').toString().trim().replace(/^@/, '');
      const matric = (data.get('matric') || '').toString().trim();
      if (!name || !nick || !matric){ toast('Please complete all fields'); return; }
      const initials = name.split(' ').filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join('');
      state.user = {
        ...(state.user || DEMO_USER),
        name, nick, matric,
        uni: (data.get('uni') || 'Bells University of Technology').toString(),
        dept: (data.get('dept') || 'Computer Science').toString(),
        level: (data.get('level') || '400 Level').toString(),
        initials,
        verified: true,
        email: (state.user && state.user.email) || DEMO_USER.email
      };
      state.kycDraft = null;
      state.phase = 'app';
      state.view = 'home';
      save(); render();
      toast('Verification complete — welcome to Ring');
      break;
    }
    case 'create-post': {
      const text = (data.get('text') || '').toString().trim();
      const cat = (data.get('cat') || 'Campus Gist').toString();
      if (!text){ toast('Write something first'); return; }
      publishPost(text, cat);
      closeModal();
      state.view = 'feed';
      render();
      toast('Post published');
      break;
    }
    case 'add-comment': {
      const text = (data.get('text') || '').toString().trim();
      const postId = form.dataset.post;
      if (!text) return;
      const p = state.posts.find(x => x.id === postId);
      if (!p) return;
      p.comments.push({
        id: 'c' + Date.now(),
        nick: state.user.nick,
        initials: state.user.initials,
        text,
        createdAt: Date.now(),
        likes: 0,
        liked: false,
        replies: []
      });
      save();
      openComments(postId);
      toast('Comment added');
      break;
    }
    case 'add-reply': {
      const text = (data.get('text') || '').toString().trim();
      const postId = form.dataset.post;
      const commentId = form.dataset.comment;
      if (!text) return;
      const p = state.posts.find(x => x.id === postId);
      const c = p && p.comments.find(x => x.id === commentId);
      if (!c) return;
      c.replies.push({
        id: 'r' + Date.now(),
        nick: state.user.nick,
        initials: state.user.initials,
        text,
        createdAt: Date.now()
      });
      save();
      openComments(postId);
      toast('Reply added');
      break;
    }
    case 'ai-send': {
      const text = (data.get('text') || '').toString().trim();
      if (!text) return;
      state.aiMessages.push({ role:'me', text });
      state.aiMessages.push({ role:'ai', text: aiRespond(text) });
      state.aiDraft = '';
      save(); render();
      break;
    }
    case 'add-task': {
      const title = (data.get('title') || '').toString().trim();
      const course = (data.get('course') || 'General').toString().trim();
      const due = (data.get('due') || todayISO(1)).toString();
      const priority = (data.get('priority') || 'medium').toString();
      if (!title){ toast('Enter a task title'); return; }
      state.tasks.push({ id:'t' + Date.now(), title, course, due, priority, done:false });
      save(); closeModal(); render(); toast('Task added');
      break;
    }
    case 'add-class': {
      const code = (data.get('code') || '').toString().trim();
      const title = (data.get('title') || '').toString().trim();
      const venue = (data.get('venue') || '').toString().trim();
      const day = Number(data.get('day') || 1);
      const start = (data.get('start') || '08:00').toString();
      const end = (data.get('end') || '10:00').toString();
      if (!code || !title){ toast('Course code and title are required'); return; }
      const editId = form.dataset.edit;
      if (editId){
        const c = state.classes.find(x => x.id === editId);
        if (c) Object.assign(c, { code, title, venue, day, start, end });
        toast('Class updated');
      } else {
        state.classes.push({ id:'c' + Date.now(), code, title, venue, day, start, end });
        toast('Class added');
      }
      save(); closeModal(); render();
      break;
    }
    case 'edit-profile': {
      const name = (data.get('name') || '').toString().trim();
      const nick = (data.get('nick') || '').toString().trim().replace(/^@/, '');
      const matric = (data.get('matric') || '').toString().trim();
      if (!name || !nick){ toast('Name and nickname are required'); return; }
      const initials = name.split(' ').filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join('');
      Object.assign(state.user, {
        name, nick, matric, initials,
        dept: (data.get('dept') || state.user.dept).toString(),
        level: (data.get('level') || state.user.level).toString()
      });
      save(); closeModal(); render(); toast('Profile updated');
      break;
    }
  }
});

/* ---------- change delegation (selects used as actions) ---------- */
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act="res-filter"]');
  if (el){
    state.academicsResFilter[el.dataset.key] = el.value;
    render();
  }
});

/* ============================================================
   MODALS — tasks / classes / profile
   ============================================================ */
function openTaskModal(){
  openModal(`
    <div class="sheet-head">
      <div class="sheet-title">Add task</div>
      <button class="icon-btn" data-act="close-modal">${icon('x', 20)}</button>
    </div>
    <form data-form="add-task">
      <div class="field"><label>Task</label><input class="input" name="title" placeholder="e.g. Database assignment" required /></div>
      <div class="field"><label>Course</label><input class="input" name="course" placeholder="e.g. CSC 405" /></div>
      <div class="row" style="gap:10px">
        <div class="field grow"><label>Due date</label><input class="input" type="date" name="due" value="${todayISO(1)}" /></div>
        <div class="field grow"><label>Priority</label>
          <select class="select" name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="row" style="gap:10px;margin-top:6px">
        <button type="button" class="btn ghost grow" data-act="close-modal">Cancel</button>
        <button type="submit" class="btn primary grow">Add task</button>
      </div>
    </form>`);
}
function openClassModal(existing){
  const c = existing || { code:'', title:'', venue:'', day: state.academicsDay || 1, start:'08:00', end:'10:00' };
  openModal(`
    <div class="sheet-head">
      <div class="sheet-title">${existing ? 'Edit class' : 'Add class'}</div>
      <button class="icon-btn" data-act="close-modal">${icon('x', 20)}</button>
    </div>
    <form data-form="add-class" ${existing ? `data-edit="${existing.id}"` : ''}>
      <div class="row" style="gap:10px">
        <div class="field grow"><label>Course code</label><input class="input" name="code" value="${esc(c.code)}" placeholder="CSC 401" required /></div>
        <div class="field grow"><label>Day</label>
          <select class="select" name="day">
            ${[1,2,3,4,5].map(d => `<option value="${d}" ${c.day === d ? 'selected' : ''}>${DAY_FULL[d]}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field"><label>Course title</label><input class="input" name="title" value="${esc(c.title)}" placeholder="Compiler Design" required /></div>
      <div class="field"><label>Venue</label><input class="input" name="venue" value="${esc(c.venue)}" placeholder="LT 2" /></div>
      <div class="row" style="gap:10px">
        <div class="field grow"><label>Start</label><input class="input" type="time" name="start" value="${esc(c.start)}" /></div>
        <div class="field grow"><label>End</label><input class="input" type="time" name="end" value="${esc(c.end)}" /></div>
      </div>
      <div class="row" style="gap:10px;margin-top:6px">
        <button type="button" class="btn ghost grow" data-act="close-modal">Cancel</button>
        <button type="submit" class="btn primary grow">${existing ? 'Save changes' : 'Add class'}</button>
      </div>
    </form>`);
}
function openProfileModal(){
  const u = state.user;
  const depts = ['Computer Science','Information Technology','Cyber Security','Software Engineering','Accounting','Business Administration','Mass Communication','Biochemistry','Microbiology','Mechanical Engineering','Electrical Engineering','Civil Engineering','Architecture','Law'];
  const levels = ['100 Level','200 Level','300 Level','400 Level','500 Level'];
  openModal(`
    <div class="sheet-head">
      <div class="sheet-title">Edit profile</div>
      <button class="icon-btn" data-act="close-modal">${icon('x', 20)}</button>
    </div>
    <form data-form="edit-profile">
      <div class="field"><label>Full name</label><input class="input" name="name" value="${esc(u.name)}" required /></div>
      <div class="field"><label>Nickname</label><input class="input" name="nick" value="${esc(u.nick)}" required /></div>
      <div class="field"><label>Matriculation number</label><input class="input" name="matric" value="${esc(u.matric)}" /></div>
      <div class="field"><label>Department</label>
        <select class="select" name="dept">${depts.map(d => `<option ${d === u.dept ? 'selected' : ''}>${d}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Academic level</label>
        <select class="select" name="level">${levels.map(l => `<option ${l === u.level ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </div>
      <div class="row" style="gap:10px;margin-top:6px">
        <button type="button" class="btn ghost grow" data-act="close-modal">Cancel</button>
        <button type="submit" class="btn primary grow">Save changes</button>
      </div>
    </form>`);
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  load();
  if (state.user){
    state.phase = 'app';
    if (!state.view) state.view = 'home';
  } else if (state.seenOnboarding){
    state.phase = 'auth';
  } else {
    state.phase = 'splash';
  }
  render();

  if (state.phase === 'splash'){
    setTimeout(() => {
      if (state.phase === 'splash'){ state.phase = 'onboarding'; render(); }
    }, 1900);
  }
})();
</script>
</body>
